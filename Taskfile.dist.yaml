version: "3.48"

tasks:
  template:
    desc: Fetch template updates
    interactive: true
    env:
      GIT_CONFIG_GLOBAL: ""
      GIT_CONFIG_SYSTEM: ""
    cmds:
      - >-
        copier
        update
        --answers-file
        .copier-answers.yaml
        {{ .CLI_ARGS }}
  flake:
    desc: Update flake.lock
    cmds:
      - >-
        nix
        --accept-flake-config
        --extra-experimental-features
        'nix-command flakes'
        --no-warn-dirty
        flake
        update
        {{ .CLI_ARGS }}
  fmt:
    desc: Format files
    cmds:
      - >-
        trunk
        fmt
        {{ .CLI_ARGS }}
  lint:
    desc: Lint files
    cmds:
      - >-
        trunk
        check
        {{ .CLI_ARGS }}
  secret:
    desc: Edit secrets
    interactive: true
    cmds:
      - >-
        sops
        {{ .CLI_ARGS }}
  init:
    desc: Initialize Terraform
    interactive: true
    cmds:
      - >-
        terraform
        -chdir=src/
        init
        {{ .CLI_ARGS }}
  plan:
    desc: Create an execution plan
    interactive: true
    cmds:
      - >-
        terraform
        -chdir=src/
        plan
        {{ .CLI_ARGS }}
  apply:
    desc: Apply changes
    interactive: true
    cmds:
      - >-
        terraform
        -chdir=src/
        apply
        {{ .CLI_ARGS }}
